services:
  tradingagents:
    build:
      context: ../源代码
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TRADINGAGENTS_RESULTS_DIR: /home/appuser/.tradingagents/logs
      TRADINGAGENTS_CACHE_DIR: /home/appuser/.tradingagents/cache
      TRADINGAGENTS_MEMORY_LOG_PATH: /home/appuser/.tradingagents/memory/trading_memory.md
    volumes:
      - ./data/tradingagents:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build:
      context: ../源代码
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      TRADINGAGENTS_RESULTS_DIR: /home/appuser/.tradingagents/logs
      TRADINGAGENTS_CACHE_DIR: /home/appuser/.tradingagents/cache
      TRADINGAGENTS_MEMORY_LOG_PATH: /home/appuser/.tradingagents/memory/trading_memory.md
    volumes:
      - ./data/tradingagents:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama